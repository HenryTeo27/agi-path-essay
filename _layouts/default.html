<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }} — Henry Teo</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.github.build_revision }}">
</head>
<body>
  <main class="wrapper">
    <div class="page-tools">
      <nav class="publication-links" aria-label="{% if page.lang == 'zh-CN' %}文章其他版本{% else %}Other versions of the essay{% endif %}">
        <span>{% if page.lang == 'zh-CN' %}其他版本{% else %}Also on{% endif %}</span>
        <a href="https://medium.com/@eehern27/agi-path-the-doors-we-havent-opened-yet-d49717fc53b7">Medium</a>
        <span aria-hidden="true">·</span>
        <a href="https://henryteo.substack.com/p/agi-path-the-doors-we-havent-opened">Substack</a>
        <span aria-hidden="true">·</span>
        <a href="https://github.com/HenryTeo27/agi-path-essay/blob/main/manuscript.txt">Manuscript</a>
      </nav>
      <nav class="language-switch" aria-label="Language / 语言">
        <a href="{{ '/' | relative_url }}" lang="en"{% if page.lang != 'zh-CN' %} aria-current="page"{% endif %}>English</a>
        <a href="{{ '/zh/' | relative_url }}" lang="zh-CN"{% if page.lang == 'zh-CN' %} aria-current="page"{% endif %}>中文</a>
      </nav>
    </div>
    <section>
      {{ content }}
    </section>
  </main>
</body>
</html>
